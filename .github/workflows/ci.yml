name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Docker is available on ubuntu runners, so the docker sandbox tests run here too.
      - run: bun test
      - run: bun run build
      - name: smoke-test the binary
        run: |
          dist/bunker --version
          set +e
          dist/bunker
          [ $? -eq 2 ]
