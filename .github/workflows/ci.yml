name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Docker is available on ubuntu runners, so the docker sandbox tests run here too.
      - run: bun test
      - run: bun run build
      - name: smoke-test the binary
        run: |
          dist/bunker --version
          set +e
          dist/bunker
          [ $? -eq 2 ]
