setup = "bun install --frozen-lockfile"
verify = "bun test && bun run typecheck"
# bunker's own gate code: an agent PR that weakens it must not auto-merge
review_paths = ["src/pipeline/steps/pr.ts", "src/worktree/steering.ts", "src/pipeline/review.ts", "src/core/config.ts"]

[watch]
# daily spend cap for bunker's own watcher; beats ~/.config/bunker max_cost_day (#482)
max_cost_day = 100

[models]
# Opus 5.5 for every bunker role in this repo (#605, same as the bunary repos); beats the global BUNKER_MODEL (#548)
default = "claude-opus-5-5"
