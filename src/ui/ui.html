<body>
<header><b>bunker</b> <span id="status">connecting…</span> <span class="muted" id="watchers"></span> <span class="muted addr" id="addr"></span></header>
<nav id="tabs"></nav>
<main id="main"><div class="muted" id="empty">no runs yet — start one with bunker --ui</div></main>
<script id="model">
// Pure state and view-model code: no DOM, so tests can load it on its own.
const Model = (() => {
  const STAGES = ["setup", "audit", "implement", "review", "verify", "PR", "waiting for merge", "merged", "done", "failed"];

    if (e.type === "budget") { r.spend = e.budget; return; }

      const text = e.text || "";

      const bl = /^blocked by #(\d+): (.*)$/.exec(text);
      if (bl && e.issue !== undefined) r.blocked.set(e.issue, { number: Number(bl[1]), title: bl[2] });

      const target = e.issue !== undefined ? r.runs.get("#" + e.issue) : live.length === 1 ? live[0] : undefined;
      if (target) target.log.push({ t: e.at, kind: "note", text });

      if (r.notes.length > 50) r.notes.shift();
      return;

    i.end = e.at;

      i.stage = e.name;
      if (e.model) i.model = e.model;
      i.done = isDone(e.name);
      if (e.name === "failed") i.reason = e.reason || e.text || "";

      if (e.title) i.title = e.title;
      if (e.logPath) i.logPath = e.logPath;
      if (e.url) i.url = e.url;

  function queue(r) {
    const started = new Set([...r.runs.keys()]);
    const rows = [];
    const body = r.queueText.replace(/^queue:\s*/, "");
    for (const part of body.split(" · ")) {
      const m = /^#(\d+)(?: \(([^)]*)\))?/.exec(part.trim());
      if (!m || started.has("#" + m[1])) continue;
      const issue = Number(m[1]);
      rows.push({ issue, tags: m[2] ? m[2].split(", ") : [], blockedOn: r.blocked.get(issue) });
    }
    for (const [issue, b] of r.blocked) if (!rows.some((x) => x.issue === issue) && !(r.runs.get("#" + issue) || {}).stage) rows.push({ issue, tags: [], blockedOn: b });
    return rows;
  }
  function shepherd(r) {
    const rows = new Map(r.shepherd);
    if (r.watcher) for (const s of r.watcher.shepherd) rows.set(s.pr, s);
    return [...rows.values()];
  }
  /** Tab label: status dot kind plus a count ("2 running", "1 failed", "idle"). */
  function tab(r, now) {
    const g = groups(r, now);
    const failed = g.finished.filter((f) => f.outcome === "failed").length;
    if (g.running.length) return { kind: "working", icon: "●", label: g.running.length + " running" };
    if (g.waiting.length) return { kind: "waiting", icon: "◐", label: g.waiting.length + " waiting for merge" };
    if (failed) return { kind: "failed", icon: "✕", label: failed + " failed" };
    return { kind: "idle", icon: "○", label: "idle" };
  }
  /** Spend windows with their fill and level: warn from 80%, full from 100%. */
  function spend(r) {
    const b = r.spend;
    if (!b) return undefined;
    let est = 0;
    for (const x of r.runs.values()) if (!x.done && x.est !== undefined) est += x.est;
    const win = (label, w) => {
      const spent = w.spentUsd + est;
      const frac = w.capUsd !== undefined && w.capUsd > 0 ? spent / w.capUsd : undefined;
      return { label, spent, cap: w.capUsd, frac, level: frac === undefined ? "" : frac >= 1 ? "full" : frac >= 0.8 ? "warn" : "", estimated: est > 0 };
    };
    return { windows: [win("today", b.day), win("30 days", b.month)], pausedUntil: b.pausedUntil && b.pausedUntil > Date.now() ? b.pausedUntil : undefined };
  }
  function idle(r, now) {
    const since = day0(now);
    const g = groups(r, now);
    const merged = g.finished.filter((f) => f.outcome === "merged");
    const all = r.watcher ? r.watcher.merged : [];
    const last = all.length ? all[all.length - 1] : undefined;
    return { nextPassAt: r.watcher && r.watcher.nextPassAt, spentToday: r.spend ? r.spend.day.spentUsd : undefined, mergedToday: merged.length, lastMerge: last ? { issue: last.issue, prUrl: last.prUrl, at: last.at } : merged[0] ? { issue: merged[0].issue, prUrl: merged[0].prUrl, at: merged[0].at } : undefined };
  }
  const watcherLive = (r, now) => !!r.watcher && ([...r.runs.values()].some((x) => !x.done) || (r.watcher.nextPassAt !== undefined && r.watcher.nextPassAt > now - 60000));
  return { STAGES, TRACK, newRepo, ingest, track, groups, queue, shepherd, tab, spend, idle, watcherLive };
})();
</script>
<script>

  const all = [...repos.values()].map((x) => x.model);
  const working = all.some((m) => Model.groups(m, now).running.length);
  document.getElementById("status").textContent = connected ? (working ? "● working" : "○ idle") : "✕ disconnected";
  const live = all.filter((m) => Model.watcherLive(m, now)).length;
  document.getElementById("watchers").textContent = live + (live === 1 ? " watcher" : " watchers");
}
let connected = false;
document.getElementById("addr").textContent = location.host + " · read-only";
window.addEventListener("hashchange", render);
let timer;
const later = () => { clearTimeout(timer); timer = setTimeout(render, 100); };
function connect() {
  const ws = new WebSocket("ws://" + location.host + "/events" + location.search);
  ws.onopen = () => { connected = true; later(); };
  ws.onmessage = (m) => {
    const d = JSON.parse(m.data);
    if (closed.has(d.repo)) return;
    let r = repos.get(d.repo);
    if (!r) { r = { name: d.repo, model: Model.newRepo() }; repos.set(d.repo, r); }
    Model.ingest(r.model, d.event);
    later();
  };
  ws.onclose = () => { connected = false; render(); };
}
// The clock tick leaves the page alone while the user is selecting text.
setInterval(() => { const sel = getSelection(); if (!sel || sel.isCollapsed) render(); }, 1000);
connect();
</script>
