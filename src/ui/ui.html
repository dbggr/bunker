<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>bunker</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #111; color: #ddd; }
  header { padding: 10px 16px; background: #1b1b1b; border-bottom: 1px solid #333; }
  main { padding: 12px 16px; }
  .issue { border: 1px solid #333; border-radius: 6px; margin-bottom: 10px; background: #181818; }
  .head { display: flex; gap: 14px; align-items: baseline; padding: 8px 12px; cursor: pointer; flex-wrap: wrap; }
  .head b { min-width: 3em; }
  .stage { padding: 1px 8px; border-radius: 10px; background: #345; }
  .stage.merged { background: #264; } .stage.failed { background: #622; }
  .muted { color: #888; }
  .detail { display: none; padding: 0 12px 10px; }
  .issue.open .detail { display: block; }
  .feed { font: 12px/1.4 ui-monospace, monospace; max-height: 340px; overflow-y: auto; background: #0c0c0c; padding: 6px; white-space: pre-wrap; word-break: break-word; }
  .feed .tool { color: #8ab; } .feed .stagel { color: #db6; } .feed .res { color: #9c9; }
  a { color: #7af; }
  #tabs { display: flex; gap: 2px; background: #1b1b1b; border-bottom: 1px solid #333; padding: 0 8px; flex-wrap: wrap; }
  .tab { padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; display: flex; gap: 8px; align-items: center; }
  .tab.sel { border-bottom-color: #7af; background: #222; }
  .tab .x { color: #888; margin-left: 4px; } .tab .x:hover { color: #fff; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #666; display: inline-block; }
  .dot.working { background: #4a4; } .dot.waiting { background: #db6; } .dot.failed { background: #c44; }
  .budget { border: 1px solid #333; border-radius: 6px; margin-bottom: 10px; padding: 8px 12px; background: #181818; }
  .budget:empty { display: none; }
  .bar { height: 6px; background: #333; border-radius: 3px; margin: 4px 0 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #4a4; }
  .bar.warn > i { background: #db6; } .bar.full > i { background: #c44; }
  .pane { display: none; } .pane.sel { display: block; }
</style>
</head>
<body>
<header><b>bunker</b> <span class="muted" id="conn">connecting…</span></header>
<nav id="tabs"></nav>
<main id="main"><div class="muted" id="empty">no runs yet — start one with bunker --ui</div></main>
<script>
const STAGES = ["setup", "audit", "implement", "review", "verify", "PR", "waiting for merge", "merged", "done", "failed"];
const repos = new Map();
const closed = new Set();
const main = document.getElementById("main");
const tabs = document.getElementById("tabs");
const conn = document.getElementById("conn");
const clock = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return s >= 60 ? Math.floor(s / 60) + "m" + String(s % 60).padStart(2, "0") + "s" : s + "s"; };
const selected = () => decodeURIComponent(location.hash.slice(1));
function key(e) { return e.issue !== undefined ? "#" + e.issue : e.task !== undefined ? "task " + e.task : "run"; }
function getRepo(name) {
  let r = repos.get(name);
  if (r) return r;
  const tab = document.createElement("div");
  tab.className = "tab";
  tab.innerHTML = '<span class="dot"></span><span class="name"></span><span class="x" title="close tab">×</span>';
  tab.querySelector(".name").textContent = name;
  tab.onclick = () => { location.hash = encodeURIComponent(name); };
  tab.querySelector(".x").onclick = (ev) => {
    ev.stopPropagation();
    closed.add(name);
    r.tab.remove(); r.pane.remove(); repos.delete(name);
    if (selected() === name) location.hash = "";
    render();
  };
  const pane = document.createElement("div");
  pane.className = "pane";
  tabs.appendChild(tab);
  main.appendChild(pane);
  const budget = document.createElement("div");
  budget.className = "budget";
  pane.appendChild(budget);
  r = { name, tab, pane, issues: new Map(), budget, spend: undefined };
  repos.set(name, r);
  return r;
}
function status(r) {
  let working = false, waiting = false, failed = false;
  for (const i of r.issues.values()) {
    if (i.stage === "failed") failed = true;
    else if (!i.done) { if (i.stage === "waiting for merge") waiting = true; else working = true; }
  }
  return working ? "working" : waiting ? "waiting" : failed ? "failed" : "idle";
}
function render() {
  document.getElementById("empty").style.display = repos.size ? "none" : "";
  let sel = selected();
  if (!repos.has(sel)) sel = repos.keys().next().value;
  for (const r of repos.values()) {
    const s = status(r);
    r.tab.querySelector(".dot").className = "dot " + s;
    r.tab.title = s === "waiting" ? "waiting for merge" : s;
    r.tab.classList.toggle("sel", r.name === sel);
    r.pane.classList.toggle("sel", r.name === sel);
  }
}
window.addEventListener("hashchange", render);
function get(r, k) {
  let i = r.issues.get(k);
  if (i) return i;
  const el = document.createElement("div");
  el.className = "issue";
  el.innerHTML = '<div class="head"><b></b><span class="stage"></span><span class="round muted"></span><span class="time muted"></span><span class="cost muted"></span><span class="pr"></span></div>' +
    '<div class="detail"><div class="muted logpath"></div><div class="feed"></div></div>';
  el.querySelector(".head").onclick = () => el.classList.toggle("open");
  el.querySelector("b").textContent = k;
  r.pane.appendChild(el);
  i = { el, start: undefined, end: undefined, cost: 0, est: undefined, tokens: 0, feed: el.querySelector(".feed"), done: false, stage: "" };
  r.issues.set(k, i);
  return i;
}
function line(i, cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = text;
  const stick = i.feed.scrollTop + i.feed.clientHeight >= i.feed.scrollHeight - 20;
  i.feed.appendChild(d);
  if (stick) i.feed.scrollTop = i.feed.scrollHeight;
}
const usd = (n) => "$" + n.toFixed(2);
const tokens = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n));
// Exact cost of finished agent calls, plus a marked estimate of the call in flight (replaced, never summed, once its result arrives).
function costText(i) {
  if (i.est !== undefined) return "~" + usd(i.cost + i.est);
  return usd(i.cost) + (i.tokens ? " · " + tokens(i.tokens) + " tok" : "");
}
function renderBudget(r) {
  const b = r.spend;
  if (!b) { r.budget.replaceChildren(); return; }
  let est = 0;
  for (const i of r.issues.values()) if (!i.done && i.est !== undefined) est += i.est;
  const mark = est > 0 ? "~" : "";
  const parts = [["today", b.day, 1], ["30 days", b.month, 1]].map(([label, w]) => {
    const spent = w.spentUsd + est;
    return label + " " + mark + usd(spent) + (w.capUsd !== undefined ? " / " + usd(w.capUsd).replace(/\.00$/, "") : " (no cap)");
  });
  const head = document.createElement("div");
  head.textContent = parts.join(" · ");
  const kids = [head];
  for (const w of [b.day, b.month]) {
    if (w.capUsd === undefined) continue;
    const frac = (w.spentUsd + est) / w.capUsd;
    const bar = document.createElement("div");
    bar.className = "bar" + (frac >= 1 ? " full" : frac >= 0.8 ? " warn" : "");
    const fill = document.createElement("i");
    fill.style.width = Math.min(100, frac * 100) + "%";
    bar.appendChild(fill);
    kids.push(bar);
  }
  if (b.pausedUntil && b.pausedUntil > Date.now()) {
    const p = document.createElement("div");
    p.className = "muted";
    p.textContent = "no new issues until " + new Date(b.pausedUntil).toLocaleString();
    kids.push(p);
  }
  r.budget.replaceChildren(...kids);
}
function onEvent(m) {
  if (closed.has(m.repo)) return;
  const e = m.event;
  const r = getRepo(m.repo);
  if (e.type === "budget") { r.spend = e.budget; renderBudget(r); return; }
  const i = get(r, key(e));
  i.start ??= e.at;
  i.end = e.at;
  const q = (s) => i.el.querySelector(s);
  if (e.round !== undefined) q(".round").textContent = "round " + e.round + (e.role ? " " + e.role : "");
  if (e.type === "stage") {
    const s = q(".stage");
    s.textContent = e.name + (e.model ? " · " + e.model : "");
    s.title = "stage " + (STAGES.indexOf(e.name) + 1) + " of " + STAGES.length + ": " + STAGES.join(" → ");
    s.className = "stage " + (e.name === "merged" || e.name === "done" ? "merged" : e.name === "failed" ? "failed" : "");
    i.stage = e.name;
    i.done = e.name === "merged" || e.name === "done" || e.name === "failed";
    line(i, "stagel", "— " + e.name + (e.model ? " · " + e.model : "") + (e.text ? " (" + e.text + ")" : "") + (e.reason ? ": " + e.reason : ""));
  } else if (e.type === "meta") {
    if (e.logPath) q(".logpath").textContent = "log: " + e.logPath;
    if (e.url) { const a = document.createElement("a"); a.href = e.url; a.textContent = "PR"; a.target = "_blank"; a.rel = "noreferrer"; q(".pr").replaceChildren(a); }
  } else if (e.type === "toolCall") line(i, "tool", "▸ " + e.name);
  else if (e.type === "text") line(i, "txt", e.text || "");
  else if (e.type === "usage") { i.est = e.estCostUsd; i.tokens = e.tokens ? e.tokens.input + e.tokens.output + e.tokens.cacheRead + e.tokens.cacheWrite : 0; }
  else if (e.type === "result") { i.cost += e.costUsd || 0; i.est = undefined; i.tokens = 0; line(i, "res", "result" + (e.costUsd ? " $" + e.costUsd.toFixed(2) : "")); }
  if (e.type === "stage" && i.done) { i.est = undefined; i.tokens = 0; }
  q(".cost").textContent = costText(i);
  renderBudget(r);
  render();
}
setInterval(() => { for (const r of repos.values()) for (const i of r.issues.values()) if (i.start && !i.done) i.el.querySelector(".time").textContent = clock(Date.now() - i.start); }, 1000);
function tick() { for (const r of repos.values()) for (const i of r.issues.values()) if (i.start && i.done) i.el.querySelector(".time").textContent = clock(i.end - i.start); }
function open() {
  const ws = new WebSocket("ws://" + location.host + "/events" + location.search);
  ws.onopen = () => (conn.textContent = "live");
  ws.onmessage = (m) => { onEvent(JSON.parse(m.data)); tick(); };
  ws.onclose = () => (conn.textContent = "disconnected");
}
open();
</script>
</body>
</html>
